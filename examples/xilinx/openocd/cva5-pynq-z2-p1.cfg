# P1 bring-up: DM + System Bus Access only. The core is not debug-capable yet,
# so no riscv target is created; the DTM is driven with raw IR/DR scans.
#
#   openocd -f pynq-z2-jtag.cfg -f cva5-pynq-z2-p1.cfg -c "init; p1_test; shutdown"
#   openocd -f pynq-z2-jtag.cfg -f cva5-pynq-z2-p1.cfg -c "init; cpu_hold; shutdown"
#   openocd -f pynq-z2-jtag.cfg -f cva5-pynq-z2-p1.cfg -c "init; cpu_release; shutdown"
#   openocd -f pynq-z2-jtag.cfg -f cva5-pynq-z2-p1.cfg -c "init; p1_diag; shutdown"

jtag newtap riscv cpu -irlen 6 -expected-id 0x23727093 -ignore-version
jtag newtap arm_dap tap -irlen 4 -expected-id 0x4ba00477

set _TAP      riscv.cpu
set _IR_DTMCS 0x22    ;# BSCANE2 USER3
set _IR_DMI   0x23    ;# BSCANE2 USER4

# The memory map, from examples/sw/soc.h. Named rather than written into each
# access, because the addresses here are decoded inside cva5_axi_xbar: an
# address in no window returns a decode error, which arrives as "SBA error 2"
# and looks exactly like a broken bus. Keep these two in step with soc.h.
set RAM_BASE   0x80000000
set RAM_SIZE   0x00020000
set UART_BASE  0x10000000
set CLINT_BASE 0x02000000
set CLINT_MTIME_OFF 0xbff8
set PLIC_BASE  0x0C000000
set SPI_BASE   0x20000000
set I2C_BASE   0x28000000

# Register offsets the diagnostic below reads, also from soc.h.
set PLIC_PRIO1_OFF   0x4      ;# source 1's priority, read/write, resets to 0
set SPI_STATUS_OFF   0x0      ;# bit 0 is idle, and is 1 after reset
set I2C_PRESCALE_OFF 0xc      ;# resets to cva5_i2c_axi's DEFAULT_PRESCALE
set I2C_PRESCALE_RST 250      ;# clk / (4 x 100 kHz) at 100 MHz

# sbbusyerror (22) and sberror (14:12) are write-1-to-clear and sticky, and
# nothing else clears them: an error left behind by one invocation is still
# there for the next OpenOCD session, because the Debug Module keeps its state
# as long as the FPGA holds its configuration. sb_wait would then report that
# stale error against the first access of the new session. Every access below
# therefore ORs this into the sbcs write that sets up the transfer, which
# clears both in the same DMI write the access needed anyway.
set SB_ERR_CLR [expr {(1 << 22) | (7 << 12)}]

proc hexval {s} { return [expr {"0x$s"}] }

# ---- DTM ------------------------------------------------------------------
proc dtmcs_rd {} {
    global _TAP _IR_DTMCS
    irscan $_TAP $_IR_DTMCS
    return [hexval [drscan $_TAP 32 0]]
}
proc dtmcs_dmireset {} {
    global _TAP _IR_DTMCS
    irscan $_TAP $_IR_DTMCS
    drscan $_TAP 32 [expr {1 << 16}]
}

# Session prologue, run automatically before the first DMI access:
#  1. Clock the DTM and clear any sticky DMI error (dtmcs.dmireset), as
#     OpenOCD's own RISC-V driver does.
#  2. Activate the Debug Module. After power-up or a board reset (SW0) the DM
#     comes up with dmactive=0, and per the debug spec only the dmactive bit is
#     writable until it reads back 1. Without this, the first dmcontrol write of
#     a session after a reset sets dmactive but silently drops ndmreset, which
#     is why cpu_hold used to need two runs.
set _dmi_ready 0
proc dmi_prepare {} {
    global _dmi_ready
    if {$_dmi_ready} { return }
    dtmcs_rd
    dtmcs_dmireset
    runtest 200
    set _dmi_ready 1
    dm_activate
}
proc dm_activate {} {
    if {[dmi_rd 0x10] & 1} { return }
    dmi_wr 0x10 0x1
    for {set i 0} {$i < 100} {incr i} {
        if {[dmi_rd 0x10] & 1} { echo "DM activated (was inactive after reset)"; return }
    }
    error "Debug Module did not activate (dmactive stuck at 0)"
}

# One DMI scan: shifts {addr[6:0], data[31:0], op[1:0]} (op is LSB), returns
# the captured {op/status, data, addr} of the PREVIOUS request.
proc dmi_scan {op data addr} {
    global _TAP _IR_DMI
    irscan $_TAP $_IR_DMI
    set r [drscan $_TAP 2 $op 32 $data 7 $addr]
    runtest 20
    return $r
}

# Issue a request, then scan a NOP to collect its result; retry on busy.
proc dmi_xfer {op addr data} {
    dmi_prepare
    for {set try 0} {$try < 20} {incr try} {
        dmi_scan $op $data $addr
        lassign [dmi_scan 0 0 0] st d a
        set st [hexval $st]
        if {$st == 0} { return [hexval $d] }
        if {$st == 3} { dtmcs_dmireset; runtest 100; continue }   ;# busy: clear, retry
        error [format "DMI op %d @0x%02x failed, status %d" $op $addr $st]
    }
    error [format "DMI op %d @0x%02x: still busy after retries" $op $addr]
}
proc dmi_rd {a}   { return [dmi_xfer 1 $a 0] }
proc dmi_wr {a v} { dmi_xfer 2 $a [format 0x%08x $v] }

# ---- Debug Module control -------------------------------------------------
proc dmcontrol_set {v} {
    dmi_wr 0x10 $v
    set r [dmi_rd 0x10]
    echo [format "dmcontrol = 0x%08x  ndmreset=%d dmactive=%d" $r [expr {($r >> 1) & 1}] [expr {$r & 1}]]
    if {($r & 0x3) != ($v & 0x3)} { error [format "dmcontrol write 0x%x did not stick" $v] }
}
proc cpu_hold    {} { dmcontrol_set 0x3 }   ;# dmactive | ndmreset
proc cpu_release {} { dmcontrol_set 0x1 }   ;# dmactive

# ---- System Bus Access ----------------------------------------------------
proc sb_wait {} {
    for {set i 0} {$i < 1000} {incr i} {
        set s [dmi_rd 0x38]
        if {!($s & (1 << 21))} {
            if {($s >> 12) & 7} { error [format "SBA error %d (sbcs=0x%08x)" [expr {($s >> 12) & 7}] $s] }
            return $s
        }
    }
    error "sbbusy stuck"
}
proc sb_write32 {addr val} {
    global SB_ERR_CLR
    dmi_wr 0x38 [expr {(2 << 17) | $SB_ERR_CLR}]               ;# sbaccess=32-bit
    dmi_wr 0x39 $addr
    dmi_wr 0x3c $val
    sb_wait
}
proc sb_read32 {addr} {
    global SB_ERR_CLR
    dmi_wr 0x38 [expr {(1 << 20) | (2 << 17) | $SB_ERR_CLR}]   ;# sbreadonaddr, 32-bit
    dmi_wr 0x39 $addr
    sb_wait
    return [dmi_rd 0x3c]
}
# ---- Block transfers (autoincrement) --------------------------------------
proc sb_write_block {addr words} {
    global SB_ERR_CLR
    dmi_wr 0x38 [expr {(2 << 17) | (1 << 16) | $SB_ERR_CLR}]   ;# 32-bit, autoincrement
    dmi_wr 0x39 $addr
    foreach w $words { dmi_wr 0x3c $w }
    set s [sb_wait]
    if {($s >> 22) & 1} { error "SBA busy error during block write" }
}
# Read-on-data means every sbdata read launches the fetch for the next word,
# so read-on-data has to be cleared BEFORE the last read, not after it.
# Clearing it afterwards leaves one extra fetch in flight at addr + 4*n --
# one word past the block. Inside a window that is harmless; at the top of
# one it lands outside, the bus returns a decode error, and sb_wait reports a
# spurious "SBA error 2" for a block that read back perfectly. A 128 KB walk
# ending at RAM_BASE + RAM_SIZE hits it on the final block.
proc sb_read_block {addr n} {
    global SB_ERR_CLR
    dmi_wr 0x38 [expr {(1 << 20) | (1 << 15) | (2 << 17) | (1 << 16) | $SB_ERR_CLR}] ;# readonaddr+readondata+autoinc
    dmi_wr 0x39 $addr
    set out {}
    for {set i 0} {$i < $n - 1} {incr i} { lappend out [dmi_rd 0x3c] }
    dmi_wr 0x38 [expr {2 << 17}]                   ;# stop read-on-data
    lappend out [dmi_rd 0x3c]                      ;# last word, no prefetch
    sb_wait
    return $out
}

# ---- Program loading ------------------------------------------------------
# Expects LOAD_ADDR and LOAD_WORDS from the image file generated by
# tools/elf-to-load-tcl.py. Holds the CPU in reset, writes, verifies, releases.
proc load_program {} {
    global LOAD_ADDR LOAD_WORDS
    set n [llength $LOAD_WORDS]
    cpu_hold
    echo [format "loading %0d words to 0x%08x ..." $n $LOAD_ADDR]
    sb_write_block $LOAD_ADDR $LOAD_WORDS
    set back [sb_read_block $LOAD_ADDR $n]
    set errs 0
    for {set i 0} {$i < $n} {incr i} {
        set exp [expr {[lindex $LOAD_WORDS $i]}]
        set got [lindex $back $i]
        if {$got != $exp} {
            if {$errs < 5} {
                echo [format "  mismatch @0x%08x: got 0x%08x exp 0x%08x" [expr {$LOAD_ADDR + 4*$i}] $got $exp]
            }
            incr errs
        }
    }
    if {$errs} { error "verify failed: $errs of $n words differ" }
    echo "verified, starting the CPU"
    cpu_release
}

proc uart_puts {s} {
    global UART_BASE
    foreach c [split $s ""] { sb_write32 [expr {$UART_BASE + 4}] [scan $c %c] }
}

# ---- P1 gate --------------------------------------------------------------
proc p1_test {} {
    set d [dtmcs_rd]
    echo [format "dtmcs     = 0x%08x  version=%d (expect 1)  abits=%d (expect 7)" \
          $d [expr {$d & 0xf}] [expr {($d >> 4) & 0x3f}]]

    dmcontrol_set 0x1
    set st [dmi_rd 0x11]
    echo [format "dmstatus  = 0x%08x  version=%d (expect 2)  allunavail=%d (expect 1)" \
          $st [expr {$st & 0xf}] [expr {($st >> 13) & 1}]]
    set sbcs [dmi_rd 0x38]
    echo [format "sbcs      = 0x%08x  sbversion=%d (expect 1)  sbasize=%d (expect 32)" \
          $sbcs [expr {($sbcs >> 29) & 7}] [expr {($sbcs >> 5) & 0x7f}]]

    global RAM_BASE
    set errs 0
    for {set i 0} {$i < 64} {incr i} {
        sb_write32 [expr {$RAM_BASE + 4*$i}] [expr {(0x9E3779B9 * ($i + 1)) & 0xffffffff}]
    }
    for {set i 0} {$i < 64} {incr i} {
        set exp [expr {(0x9E3779B9 * ($i + 1)) & 0xffffffff}]
        set got [sb_read32 [expr {$RAM_BASE + 4*$i}]]
        if {$got != $exp} {
            echo [format "RAM mismatch @0x%08x: got 0x%08x exp 0x%08x" [expr {$RAM_BASE + 4*$i}] $got $exp]
            incr errs
        }
    }
    echo "RAM: 64 words written/verified via SBA, $errs errors"

    uart_puts "\r\n\[P1\] hello from the debugger via SBA\r\n"
    echo "UART: check the serial terminal for the \[P1\] line"
}

proc p1_diag {} {
    global RAM_BASE UART_BASE CLINT_BASE CLINT_MTIME_OFF
    global PLIC_BASE SPI_BASE I2C_BASE
    global PLIC_PRIO1_OFF SPI_STATUS_OFF I2C_PRESCALE_OFF I2C_PRESCALE_RST
    set c [dmi_rd 0x10]
    echo [format "dmcontrol = 0x%08x  ndmreset=%d dmactive=%d" $c [expr {($c >> 1) & 1}] [expr {$c & 1}]]
    set s [dmi_rd 0x11]
    echo [format "dmstatus  = 0x%08x  allhavereset=%d" $s [expr {($s >> 19) & 1}]]
    echo [format "probing RAM 0x%08x, UART 0x%08x" $RAM_BASE $UART_BASE]
    if {[catch {sb_read32 $RAM_BASE} v]} { echo "RAM read      FAILED: $v" } else { echo [format "RAM read      ok 0x%08x" $v] }
    if {[catch {sb_read32 [expr {$UART_BASE + 8}]} v]} { echo "UART stat rd  FAILED: $v" } else { echo [format "UART stat rd  ok 0x%08x" $v] }
    if {[catch {sb_write32 [expr {$UART_BASE + 4}] 0x21} v]} { echo "UART write    FAILED: $v" } else { echo "UART write    ok (look for '!')" }

    # The CLINT is a crossbar peripheral, so the debugger can see it. mtime
    # ticks once per microsecond and is not reset by ndmreset, so it must
    # advance between two reads even with the core held in reset -- if it
    # reads back the same twice, either the prescaler is stuck or something
    # is resetting the CLINT that should not be.
    set a [expr {$CLINT_BASE + $CLINT_MTIME_OFF}]
    if {[catch {sb_read32 $a} t0]} {
        echo "CLINT mtime   FAILED: $t0"
    } else {
        if {[catch {sb_read32 $a} t1]} {
            echo "CLINT mtime   FAILED on the second read: $t1"
        } elseif {$t1 == $t0} {
            echo [format "CLINT mtime   STUCK at 0x%08x" $t0]
        } else {
            echo [format "CLINT mtime   ok 0x%08x -> 0x%08x (+%d us)" $t0 $t1 [expr {$t1 - $t0}]]
        }
    }

    # The rest of the bus. Each of these is reachable over the system bus with
    # the core held in reset, so a wrong address or a missing crossbar port
    # shows up here rather than as a program that hangs with no output.

    # The PLIC's registers all reset to zero, so reading one proves only that
    # something answered. Write and read back instead, then put it back -- the
    # PLIC resets from rstn alone, so what is left here survives into whatever
    # runs next, and examples/sw/plic.c would find it.
    set a [expr {$PLIC_BASE + $PLIC_PRIO1_OFF}]
    if {[catch {sb_write32 $a 7} v]} {
        echo "PLIC prio wr  FAILED: $v"
    } elseif {[catch {sb_read32 $a} v]} {
        echo "PLIC prio rd  FAILED: $v"
    } elseif {$v != 7} {
        echo [format "PLIC prio     MISMATCH: wrote 7 read 0x%08x" $v]
    } else {
        echo "PLIC prio     ok (write/read-back)"
        catch {sb_write32 $a 0}
    }

    # The SPI reports idle in bit 0 -- note that is idle, not busy.
    if {[catch {sb_read32 [expr {$SPI_BASE + $SPI_STATUS_OFF}]} v]} {
        echo "SPI status    FAILED: $v"
    } elseif {($v & 1) == 0} {
        echo [format "SPI status    NOT IDLE: 0x%08x" $v]
    } else {
        echo [format "SPI status    ok 0x%08x (idle)" $v]
    }

    # The I2C's prescale is the only register on this bus with a non-zero
    # reset value, which makes it the one identity check here that cannot be
    # faked by a bus that returns zeros. If this reads 250 the device is at the
    # right address and answering; it says nothing about the pins, which only
    # a device on the bus can prove -- see examples/sw/i2c.c.
    if {[catch {sb_read32 [expr {$I2C_BASE + $I2C_PRESCALE_OFF}]} v]} {
        echo "I2C prescale  FAILED: $v"
    } elseif {$v != $I2C_PRESCALE_RST} {
        echo [format "I2C prescale  UNEXPECTED: 0x%08x, expected %d" \
                     $v $I2C_PRESCALE_RST]
    } else {
        echo [format "I2C prescale  ok %d (device identified)" $v]
    }
}

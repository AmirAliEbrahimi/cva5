# CVA5 on the PYNQ-Z2: full debugging over the board's own USB-JTAG (BSCANE2).
#
#   openocd -f pynq-z2-jtag.cfg -f cva5-pynq-z2.cfg
#   riscv64-unknown-elf-gdb app.elf -ex "target extended-remote :3333"
#
# For loading programs without a debugger session, cva5-pynq-z2-p1.cfg and
# 'make load' remain the simpler path.

jtag newtap riscv cpu -irlen 6 -expected-id 0x23727093 -ignore-version
jtag newtap arm_dap tap -irlen 4 -expected-id 0x4ba00477

target create riscv.cpu riscv -chain-position riscv.cpu

# BSCANE2 USER3/USER4 as used by riscv-dbg's dmi_bscane_tap (IR length 6)
riscv set_ir idcode 0x09
riscv set_ir dtmcs  0x22
riscv set_ir dmi    0x23

riscv set_mem_access sysbus progbuf
riscv set_command_timeout_sec 10

gdb_port 3333

# OpenOCD against the Verilator harness (test_benches/debug/tb_jtag.sv).
# Start the simulation first (sh test_benches/debug/run_jtag.sh), then:
#   openocd -f test_benches/debug/cva5-sim.cfg -c "init; sim_check; shutdown"
#
# The harness builds riscv-dbg's own TAP (5-bit IR, idcode 0x00000db3) rather
# than the BSCANE2 DTM used on the board, so the IR codes are the standard
# ones: dtmcs 0x10, dmi 0x11.
adapter driver remote_bitbang
remote_bitbang host 127.0.0.1
remote_bitbang port 9999
adapter speed 10000

jtag newtap riscv cpu -irlen 5 -expected-id 0x00000db3

set _TAP      riscv.cpu
set _IR_DTMCS 0x10
set _IR_DMI   0x11

proc hexval {s} { return [expr {"0x$s"}] }

proc dtmcs_rd {} {
    global _TAP _IR_DTMCS
    irscan $_TAP $_IR_DTMCS
    return [hexval [drscan $_TAP 32 0]]
}
proc dtmcs_dmireset {} {
    global _TAP _IR_DTMCS
    irscan $_TAP $_IR_DTMCS
    drscan $_TAP 32 [expr {1 << 16}]
}

set _dmi_ready 0
proc dmi_prepare {} {
    global _dmi_ready
    if {$_dmi_ready} { return }
    dtmcs_rd
    dtmcs_dmireset
    runtest 200
    set _dmi_ready 1
    dm_activate
}
proc dm_activate {} {
    if {[dmi_rd 0x10] & 1} { return }
    dmi_wr 0x10 0x1
    for {set i 0} {$i < 100} {incr i} {
        if {[dmi_rd 0x10] & 1} { echo "DM activated"; return }
    }
    error "Debug Module did not activate"
}

proc dmi_scan {op data addr} {
    global _TAP _IR_DMI
    irscan $_TAP $_IR_DMI
    set r [drscan $_TAP 2 $op 32 $data 7 $addr]
    runtest 20
    return $r
}
proc dmi_xfer {op addr data} {
    dmi_prepare
    for {set try 0} {$try < 20} {incr try} {
        dmi_scan $op $data $addr
        lassign [dmi_scan 0 0 0] st d a
        set st [hexval $st]
        if {$st == 0} { return [hexval $d] }
        if {$st == 3} { dtmcs_dmireset; runtest 100; continue }
        error [format "DMI op %d @0x%02x failed, status %d" $op $addr $st]
    }
    error [format "DMI op %d @0x%02x: still busy after retries" $op $addr]
}
proc dmi_rd {a}   { return [dmi_xfer 1 $a 0] }
proc dmi_wr {a v} { dmi_xfer 2 $a [format 0x%08x $v] }

proc sb_wait {} {
    for {set i 0} {$i < 1000} {incr i} {
        set s [dmi_rd 0x38]
        if {!($s & (1 << 21))} {
            if {($s >> 12) & 7} { error [format "SBA error %d (sbcs=0x%08x)" [expr {($s >> 12) & 7}] $s] }
            return $s
        }
    }
    error "sbbusy stuck"
}
proc sb_write32 {addr val} {
    dmi_wr 0x38 [expr {2 << 17}]
    dmi_wr 0x39 $addr
    dmi_wr 0x3c $val
    sb_wait
}
proc sb_read32 {addr} {
    dmi_wr 0x38 [expr {(1 << 20) | (2 << 17)}]
    dmi_wr 0x39 $addr
    sb_wait
    return [dmi_rd 0x3c]
}
proc cpu_hold    {} { dmi_wr 0x10 0x3 }
proc cpu_release {} { dmi_wr 0x10 0x1 }

# P2a gate: the DTM and DM answer, and SBA reaches the harness RAM. The core is
# not debug-capable yet, so no riscv target is created here.
proc sim_check {} {
    set d [dtmcs_rd]
    echo [format "dtmcs    = 0x%08x  version=%d (expect 1)  abits=%d (expect 7)" \
          $d [expr {$d & 0xf}] [expr {($d >> 4) & 0x3f}]]
    set st [dmi_rd 0x11]
    echo [format "dmstatus = 0x%08x  version=%d (expect 2)  allunavail=%d (expect 1)" \
          $st [expr {$st & 0xf}] [expr {($st >> 13) & 1}]]
    set sbcs [dmi_rd 0x38]
    echo [format "sbcs     = 0x%08x  sbversion=%d (expect 1)  sbasize=%d (expect 32)" \
          $sbcs [expr {($sbcs >> 29) & 7}] [expr {($sbcs >> 5) & 0x7f}]]

    set errs 0
    for {set i 0} {$i < 16} {incr i} {
        sb_write32 [expr {0x40000000 + 4*$i}] [expr {(0x9E3779B9 * ($i + 1)) & 0xffffffff}]
    }
    for {set i 0} {$i < 16} {incr i} {
        set exp [expr {(0x9E3779B9 * ($i + 1)) & 0xffffffff}]
        set got [sb_read32 [expr {0x40000000 + 4*$i}]]
        if {$got != $exp} { incr errs }
    }
    echo "RAM: 16 words written/verified via SBA, $errs errors"
    if {$errs} { error "SBA verify failed" }
}
